<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Zaki Sommer - Backend Developer</title>
    <meta name="description" content="Desenvolvedor backend (Elixir) com experiência em Pix, sistemas financeiros e integrações. Estudante de Sistemas de Informação na UTFPR.">
    <meta name="theme-color" content="#000000">
    <meta name="darkreader-lock">
    <link rel="canonical" href="https://danisommer.github.io/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://danisommer.github.io/">
    <meta property="og:title" content="Daniel Zaki Sommer - Backend Developer">
    <meta property="og:description" content="Desenvolvedor backend (Elixir) com experiência em Pix, sistemas financeiros e integrações. Estudante de Sistemas de Informação na UTFPR.">
    <meta property="og:image" content="https://danisommer.github.io/images/profile_picture.jpg">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:locale:alternate" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Daniel Zaki Sommer - Backend Developer">
    <meta name="twitter:description" content="Desenvolvedor backend (Elixir) com experiência em Pix, sistemas financeiros e integrações. Estudante de Sistemas de Informação na UTFPR.">
    <meta name="twitter:image" content="https://danisommer.github.io/images/profile_picture.jpg">
    <link rel="icon" href="images/favicon.png" type="image/png" sizes="48x48">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <script>
        {
            let saved = null;
            try {
                saved = localStorage.getItem("theme");
            } catch {
                saved = null;
            }
            document.documentElement.dataset.theme = saved === "light" ? "light" : "dark";
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/sections/hero.css">
    <link rel="stylesheet" href="css/sections/experience.css">
    <link rel="stylesheet" href="css/sections/projects.css">
    <link rel="stylesheet" href="css/sections/skills.css">
    <link rel="stylesheet" href="css/sections/about.css">
    <link rel="stylesheet" href="css/sections/contact.css">
    <script type="module" src="js/main.js"></script>
</head>

<body>
    <noscript>
        <p class="noscript">Este portfólio precisa de JavaScript habilitado. / This portfolio requires JavaScript.</p>
    </noscript>

    <div class="dot-field" aria-hidden="true">
        <canvas></canvas>
    </div>

    <header class="site-header">
        <div class="wrap header-bar">
            <a href="#top" class="brand"></a>
            <nav class="nav-links" data-i18n-aria-label="a11y.mainNav">
                <a href="#experience" data-i18n="nav.experience"></a>
                <a href="#projects" data-i18n="nav.projects"></a>
                <a href="#skills" data-i18n="nav.skills"></a>
                <a href="#about" data-i18n="nav.about"></a>
                <a href="#contact" data-i18n="nav.contact"></a>
            </nav>
            <div class="header-tools">
                <div class="language-toggle" role="group" data-i18n-aria-label="a11y.language">
                    <button type="button" data-lang="pt" lang="pt-BR" title="Português">PT</button>
                    <span aria-hidden="true">/</span>
                    <button type="button" data-lang="en" lang="en" title="English">EN</button>
                </div>
                <button type="button" class="theme-toggle" data-theme-toggle data-i18n-aria-label="a11y.themeToggle">
                    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 1a6 6 0 0 1 0 12z" fill="currentColor"/></svg>
                </button>
                <button type="button" class="menu-toggle" aria-expanded="false" aria-controls="mobile-nav" data-i18n="nav.menu"></button>
            </div>
        </div>
    </header>

    <div class="mobile-nav" id="mobile-nav" inert>
        <button type="button" class="mobile-nav-close" data-i18n="nav.close" data-i18n-aria-label="a11y.menuClose"></button>
        <nav class="mobile-links" data-i18n-aria-label="a11y.mainNav">
            <a href="#experience" data-i18n="nav.experience"></a>
            <a href="#projects" data-i18n="nav.projects"></a>
            <a href="#skills" data-i18n="nav.skills"></a>
            <a href="#about" data-i18n="nav.about"></a>
            <a href="#contact" data-i18n="nav.contact"></a>
        </nav>
        <div class="mobile-controls">
            <div class="language-toggle" role="group" data-i18n-aria-label="a11y.language">
                <button type="button" data-lang="pt" lang="pt-BR" title="Português">PT</button>
                <span aria-hidden="true">/</span>
                <button type="button" data-lang="en" lang="en" title="English">EN</button>
            </div>
            <button type="button" class="theme-toggle" data-theme-toggle data-i18n-aria-label="a11y.themeToggle">
                <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 1a6 6 0 0 1 0 12z" fill="currentColor"/></svg>
            </button>
        </div>
    </div>

    <div class="overlay" aria-hidden="true"></div>

    <main id="top">
        <section id="home" class="hero">
            <div class="wrap">
                <div class="grid hero-grid">
                    <p class="hero-kicker"></p>
                    <h1 class="hero-name"></h1>
                    <figure class="hero-portrait" hidden></figure>
                    <p class="hero-lede"></p>
                    <div class="hero-focus" hidden>
                        <p class="label" data-i18n="hero.focus"></p>
                        <ul></ul>
                    </div>
                    <div class="hero-actions"></div>
                </div>
                <dl class="grid hero-facts"></dl>
            </div>
        </section>

        <section id="experience" class="section">
            <div class="wrap">
                <header class="grid section-head">
                    <p class="section-index" aria-hidden="true">01</p>
                    <h2 class="section-title" data-i18n="experience.title"></h2>
                </header>
                <div class="experience-list"></div>
            </div>
        </section>

        <section id="projects" class="section">
            <div class="wrap">
                <header class="grid section-head">
                    <p class="section-index" aria-hidden="true">02</p>
                    <h2 class="section-title" data-i18n="projects.title"></h2>
                </header>
                <div class="projects-feature"></div>
                <div class="projects-index"></div>
            </div>
        </section>

        <section id="skills" class="section">
            <div class="wrap">
                <header class="grid section-head">
                    <p class="section-index" aria-hidden="true">03</p>
                    <h2 class="section-title" data-i18n="skills.title"></h2>
                </header>
                <dl class="skills-list"></dl>
            </div>
        </section>

        <section id="about" class="section">
            <div class="wrap">
                <header class="grid section-head">
                    <p class="section-index" aria-hidden="true">04</p>
                    <h2 class="section-title" data-i18n="about.title"></h2>
                </header>
                <div class="grid about-body">
                    <div class="about-text"></div>
                    <div class="about-actions"></div>
                </div>
            </div>
        </section>

        <section id="contact" class="section">
            <div class="wrap">
                <header class="grid section-head">
                    <p class="section-index" aria-hidden="true">05</p>
                    <h2 class="section-title" data-i18n="contact.title"></h2>
                </header>
                <div class="grid contact-body">
                    <div class="contact-links"></div>
                    <form id="contact-form" class="contact-form" action="https://portfolio-contact.danibee2005.workers.dev" method="POST">
                        <p class="label contact-form-title" data-i18n="contact.formTitle"></p>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="name" data-i18n="contact.form.name"></label>
                                <input type="text" id="name" name="name" class="form-control" autocomplete="name" required>
                            </div>
                            <div class="form-group">
                                <label for="email" data-i18n="contact.form.email"></label>
                                <input type="email" id="email" name="email" class="form-control" autocomplete="email" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="subject" data-i18n="contact.form.subject"></label>
                            <input type="text" id="subject" name="subject" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="message" data-i18n="contact.form.message"></label>
                            <textarea id="message" name="message" class="form-control" rows="5" required></textarea>
                        </div>
                        <input type="text" name="_gotcha" class="form-honeypot" tabindex="-1" autocomplete="off">
                        <button type="submit" class="btn form-btn"></button>
                        <p class="form-status" role="status"></p>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap grid footer-bar">
            <div class="footer-id">
                <p class="footer-name"></p>
                <p class="footer-note"></p>
            </div>
            <nav class="footer-links" data-i18n-aria-label="a11y.contactLinks"></nav>
            <p class="copyright"></p>
        </div>
    </footer>

    <dialog class="modal" id="project-modal" aria-labelledby="project-modal-title">
        <div class="modal-content">
            <button type="button" class="close-modal" data-i18n="nav.close" data-i18n-aria-label="projects.close" autofocus></button>
            <div class="project-details"></div>
        </div>
    </dialog>
</body>

</html>
